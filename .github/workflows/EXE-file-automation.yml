name: Shiny App Build

on:
  push:
    branches: DEV-762

jobs:
  build:
    runs-on: ubuntu-latest
        
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
        
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
           r-version: '4.x'
           
      - name: List and PWD
        run: |
          pwd
          ls -latr
          mkdir dist
            
      - name: create skeleton folder and engine framework
        working-directory: dist
        run: |
          wget -o "R-Portable_4.2.0.paf.exe" "https://sourceforge.net/projects/rportable/files/R-Portable_4.2.0.paf.exe/download"
          wget -o "GoogleChromePortable_114.0.5735.199.paf.exe" "https://portableapps.com/apps/internet/google_chrome_portable"
          chmod +x R-Portable_4.2.0.paf.exe
